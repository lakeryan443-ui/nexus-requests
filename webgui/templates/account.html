<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account · Nexus Requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:linear-gradient(125deg,rgba(2,12,32,.43),rgba(2,19,46,.38)),
    url('/static/nexus-background.webp') center/cover fixed no-repeat,#071d39;
  color:#e5edf7;font:400 14px/1.7 Inter,sans-serif
}
header{
  padding:20px clamp(18px,4vw,56px);
  border-bottom:1px solid rgba(111,195,255,.22);
  background:rgba(3,18,43,.64);
  backdrop-filter:blur(14px)
}
header img{width:210px;max-width:100%;height:auto}
main{max-width:850px;margin:55px auto;padding:0 22px 60px}
a{color:#9bdcff;text-decoration:none}
a:hover{text-decoration:underline}
.back{display:inline-flex;margin-bottom:24px}
h1,h2{font-family:"Space Grotesk",sans-serif}
h1{font-size:36px;margin:0 0 10px}
h2{font-size:19px;margin:0 0 12px}
.subtitle{color:#a9c3dc;margin:0 0 30px}
.panel{
  background:rgba(8,31,66,.88);
  border:1px solid rgba(111,195,255,.22);
  border-radius:17px;padding:30px;
  box-shadow:0 10px 30px #0002;
  backdrop-filter:blur(13px)
}
section+section{
  border-top:1px solid rgba(111,195,255,.22);
  margin-top:24px;padding-top:24px
}
p{color:#c0d4e6;margin:0}
@media(max-width:600px){
  main{margin-top:28px}
  .panel{padding:22px}
  h1{font-size:29px}
}
</style>

<style id="account-form-styles">
.account-forms {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
  gap: 20px;
  margin-top: 18px;
}
.account-forms form {
  background: rgba(8, 27, 56, .55);
  border: 1px solid rgba(153, 190, 230, .2);
  border-radius: 12px;
  padding: 22px;
}
.account-forms h3 {
  margin: 0 0 20px;
  font-family: "Space Grotesk", sans-serif;
  font-size: 19px;
}
.account-forms label {
  display: block;
  margin: 15px 0 7px;
  font-size: 14px;
  font-weight: 600;
}
.account-forms input {
  box-sizing: border-box;
  display: block;
  width: 100%;
  padding: 12px;
  color: #f2f7ff;
  background: #091b36;
  border: 1px solid #526987;
  border-radius: 8px;
  font: inherit;
}
.account-forms input:focus {
  outline: 2px solid #70b8ff;
  outline-offset: 1px;
}
.account-forms button {
  margin-top: 22px;
  padding: 12px 20px;
  background: #236bc1;
  border: 1px solid #4d96e8;
  border-radius: 8px;
  color: white;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.account-forms button:hover { background: #307ed9; }
.account-forms button:disabled { opacity: .6; cursor: wait; }
.account-forms [role="status"] {
  min-height: 20px;
  font-size: 14px;
}
</style>

</head>
<body>
<header>
<img src="/static/nexus-requests-logo-v3.png" alt="Nexus Requests">
</header>
<main>
<a class="back" href="/">← Back to Dashboard</a>
<h1>Account</h1>
<p class="subtitle">Manage your Nexus Requests administrator account.</p>

<div class="panel">
<section>
<h2>Account information</h2>
<p>Username: <strong id="account-username">__ACCOUNT_USERNAME__</strong></p>
</section>
<section>

<h2>Account security</h2>
<div class="account-forms">
  <form id="change-username-form" autocomplete="off">
    <h3>Change Username</h3>
    <label for="new-username">New username</label>
    <input id="new-username" name="new_username"
           autocomplete="off" minlength="3" maxlength="32" required>

    <label for="username-current-password">Current password</label>
    <input id="username-current-password" name="current_password"
           type="password" autocomplete="current-password" required>

    <button type="submit">Save Username</button>
    <p id="username-result" role="status" aria-live="polite"></p>
  </form>

  <form id="change-password-form" autocomplete="off">
    <h3>Change Password</h3>
    <label for="password-current-password">Current password</label>
    <input id="password-current-password" name="current_password"
           type="password" autocomplete="current-password" required>

    <label for="new-password">New password</label>
    <input id="new-password" name="new_password"
           type="password" autocomplete="new-password" minlength="12" required>

    <label for="confirm-new-password">Confirm new password</label>
    <input id="confirm-new-password" name="confirm_password"
           type="password" autocomplete="new-password" minlength="12" required>

    <button type="submit">Save Password</button>
    <p id="password-result" role="status" aria-live="polite"></p>
  </form>
</div>

<p></p>
</section>
</div>
</main>

<script id="account-change-script">
(() => {
  async function submitChange(payload, result, button) {
    button.disabled = true;
    result.textContent = "Saving...";

    try {
      const tokenResponse = await fetch("/api/integrations/csrf", {
        credentials: "same-origin",
        cache: "no-store"
      });
      if (!tokenResponse.ok) throw new Error("Unable to verify your session");

      const { csrf_token } = await tokenResponse.json();

      const response = await fetch("/api/account/change", {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-CSRF-Token": csrf_token
        },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(typeof data.detail === "string"
          ? data.detail : "Account update failed");
      }

      result.textContent = "Account updated. Redirecting to login...";
      window.location.replace("/login");
    } catch (error) {
      result.textContent = error.message || "Account update failed";
      button.disabled = false;
    }
  }

  const usernameForm = document.getElementById("change-username-form");
  const passwordForm = document.getElementById("change-password-form");

  usernameForm.addEventListener("submit", event => {
    event.preventDefault();
    submitChange({
      new_username: document.getElementById("new-username").value,
      current_password: document.getElementById("username-current-password").value
    }, document.getElementById("username-result"),
       usernameForm.querySelector('button[type="submit"]'));
  });

  passwordForm.addEventListener("submit", event => {
    event.preventDefault();

    const password = document.getElementById("new-password").value;
    const confirmation = document.getElementById("confirm-new-password").value;
    const result = document.getElementById("password-result");

    if (password !== confirmation) {
      result.textContent = "New passwords do not match";
      return;
    }

    submitChange({
      new_password: password,
      current_password: document.getElementById("password-current-password").value
    }, result, passwordForm.querySelector('button[type="submit"]'));
  });
})();
</script>

</body>
</html>
